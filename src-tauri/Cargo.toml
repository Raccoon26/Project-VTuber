[package]
name = "vtuber-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.1"
publish = false

[lib]
name = "vtuber_core"
path = "src/lib.rs"

[[bin]]
name = "vtuber-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
png = "0.17"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
